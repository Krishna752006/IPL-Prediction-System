experiment:
  name: ipl_lstm_v2

data:
  path: data/processed/ab/features.parquet
  dataset_version: V1
  feature_version: lstm_features_v2
  random_seed: 42

model:
  epochs: 10
  batch_size: 1000
  learning_rate: 0.01
  lstm1_units: 128
  lstm2_units: 128
  dense1: 256
  dense2: 128
  lstm_dropout: 0.2
  lstm_recurrent_dropout: 0.2
  wicket_threashold: 0.5
  wide_threashold: 0.5

validation_gate:
  test_mae: 0.055
  test_mse: 0.45
  test_rmse: 0.07
  test_r2: 0.91

paths:
  staging_dir: models/staging
  production_dir: models/production
  mlflow_db: experiments/mlruns.db
  embeddings_json: saved_seasons